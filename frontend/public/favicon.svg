<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C663" />
      <stop offset="50%" stop-color="#D9A441" />
      <stop offset="100%" stop-color="#B37D14" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3A68" />
      <stop offset="100%" stop-color="#0B1F3A" />
    </linearGradient>
  </defs>

  <!-- Big Stylized 'A' with Building Skyline Towers -->
  <g transform="translate(0, 10)">
    <!-- Left Navy Apex Pillar -->
    <path d="M 230 40 L 140 240 L 185 240 L 230 140 Z" fill="url(#navyGrad)" />
    <path d="M 230 40 L 185 240 L 210 240 L 245 120 Z" fill="#07152B" />

    <!-- Right Gold Building Skyline Towers -->
    <!-- Tower 1 -->
    <rect x="290" y="100" width="22" height="140" fill="url(#goldGrad)" />
    <!-- Tower 2 -->
    <rect x="317" y="60" width="24" height="180" fill="url(#navyGrad)" />
    <!-- Tower 3 (Far right accent) -->
    <rect x="346" y="130" width="18" height="110" fill="url(#goldGrad)" />

    <!-- Gold Diagonal Crossbar of A -->
    <polygon points="170,170 320,158 320,175 165,190" fill="url(#goldGrad)" />

    <!-- Inner Desk + Chair + Laptop Graphic Silhouette inside 'A' -->
    <!-- Desk -->
    <rect x="210" y="200" width="75" height="7" rx="2" fill="url(#navyGrad)" />
    <rect x="218" y="207" width="5" height="23" fill="url(#navyGrad)" />
    <rect x="274" y="207" width="5" height="23" fill="url(#navyGrad)" />
    <rect x="260" y="210" width="16" height="18" fill="url(#goldGrad)" />

    <!-- Swivel Chair -->
    <!-- Seat -->
    <rect x="236" y="194" width="18" height="5" rx="2" fill="url(#navyGrad)" />
    <!-- Backrest -->
    <path d="M 240 178 C 240 174, 250 174, 250 178 L 250 193 L 240 193 Z" fill="url(#navyGrad)" />
    <!-- Base Stem & Wheels -->
    <rect x="244" y="199" width="2" height="11" fill="url(#goldGrad)" />
    <path d="M 238 210 L 252 210" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="238" cy="212" r="1.5" fill="#0B1F3A" />
    <circle cx="252" cy="212" r="1.5" fill="#0B1F3A" />

    <!-- Desktop Monitor / Laptop on desk -->
    <rect x="220" y="188" width="12" height="9" rx="1" fill="url(#goldGrad)" />
    <rect x="224" y="197" width="4" height="3" fill="#0B1F3A" />
    <ellipse cx="238" cy="199" rx="3" ry="1.5" fill="url(#goldGrad)" />
  </g>

  <!-- Typography -->
  <!-- "ALPHA" -->
  <text x="250" y="295" font-family="'Poppins', sans-serif" font-weight="900" font-size="52" fill="#0B1F3A" text-anchor="middle" letter-spacing="3">ALPHA</text>

  <!-- "OFFICE INTERIOR" with side gold rules -->
  <line x1="50" y1="316" x2="135" y2="316" stroke="#D9A441" stroke-width="3" stroke-linecap="round" />
  <text x="250" y="322" font-family="'Poppins', sans-serif" font-weight="700" font-size="20" fill="#D9A441" text-anchor="middle" letter-spacing="4">OFFICE INTERIOR</text>
  <line x1="365" y1="316" x2="450" y2="316" stroke="#D9A441" stroke-width="3" stroke-linecap="round" />

  <!-- Tagline: "DESIGNING WORKSPACES, ENHANCE PRODUCTIVITY" -->
  <text x="250" y="348" font-family="'Inter', sans-serif" font-weight="600" font-size="12.5" fill="#475569" text-anchor="middle" letter-spacing="1.5">DESIGNING WORKSPACES, ENHANCE PRODUCTIVITY</text>
</svg>